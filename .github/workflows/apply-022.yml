name: Apply 0.1.22 patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-022.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download, verify and apply patch
        run: |
          curl -fsSL -o /tmp/p022.patch "https://aka.doubaocdn.com/s/VcugbDTsmj"
          echo "c40a76b6d0618644575a87b72054d93e9ebe6133edb31ab0c166918dded6ae67  /tmp/p022.patch" | sha256sum -c
          git apply --whitespace=nowarn /tmp/p022.patch

      - name: Commit
        run: |
          git config user.name "school-tools-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git rm -f .github/workflows/apply-022.yml
          git commit -m "feat: 0.1.22 11 色调色盘、自定义色与吸管取色、粗细三档预览、墨迹栏拖动"
          git push
