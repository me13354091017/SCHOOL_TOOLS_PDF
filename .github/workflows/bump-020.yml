name: Bump 0.1.20

# 一次性：升版本号 0.1.20 + 同步 README，提交后删除本工作流。
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-020.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump version and README
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('SCHOOL_PDF/SCHOOL_TOOLS_PDF.csproj')
          s = p.read_text(encoding='utf-8')
          s = s.replace('0.1.19', '0.1.20')
          p.write_text(s, encoding='utf-8')

          p = Path('SCHOOL_PDF/installer.iss')
          s = p.read_text(encoding='utf-8')
          s = s.replace('#define MyAppVersion "0.1.19"', '#define MyAppVersion "0.1.20"')
          p.write_text(s, encoding='utf-8')

          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('当前版本 **v0.1.19（命中修复与区间调整）**', '当前版本 **v0.1.20（隐藏全部滚动条）**')
          s = s.replace('releases/download/v0.1.19/', 'releases/download/v0.1.20/')
          s = s.replace('releases/tag/v0.1.19', 'releases/tag/v0.1.20')
          s = s.replace('| **v0.1.19** |', '| **v0.1.20** | 隐藏全部滚动条（阅读区、缩略图、设置页、更新日志与错误窗口） |\n| v0.1.19 |')
          s = s.replace('- 深浅主题、主题色自定义，墨迹栏位置、缩放、边距、不透明度可调',
                        '- 深浅主题、主题色自定义，墨迹栏位置、缩放、边距、不透明度可调\n- 所有滚动条默认隐藏且不占布局，滚动仍可用滚轮与触摸平移')
          p.write_text(s, encoding='utf-8')
          print('dumped')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SCHOOL_PDF/SCHOOL_TOOLS_PDF.csproj SCHOOL_PDF/installer.iss README.md
          git rm -q -f .github/workflows/bump-020.yml
          git commit -m "chore: 版本号 0.1.20"
          git push
