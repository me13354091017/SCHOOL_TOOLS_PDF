name: Bump installer version

# 一次性：把 installer.iss 的 MyAppVersion 改为 0.1.19，提交后删除本工作流。
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-iss.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump version
        run: |
          sed -i 's/#define MyAppVersion "0.1.18"/#define MyAppVersion "0.1.19"/' SCHOOL_PDF/installer.iss
          grep -n 'MyAppVersion' SCHOOL_PDF/installer.iss | head -2
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SCHOOL_PDF/installer.iss
          git rm -q -f .github/workflows/bump-iss.yml
          git commit -m "chore: installer 版本 0.1.19"
          git push
