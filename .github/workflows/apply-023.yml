name: Apply 0.1.23 patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-023.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download, verify and apply patch
        run: |
          curl -fsSL -o /tmp/p023.patch "https://aka.doubaocdn.com/s/w0CXJo1wFg"
          echo "b059e058ebed6d3c15836d6ee4bfb24793bd8bb34b19bfb7a7c5f69170a04f09  /tmp/p023.patch" | sha256sum -c
          git apply --whitespace=nowarn /tmp/p023.patch

      - name: Commit
        run: |
          git config user.name "school-tools-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git rm -f .github/workflows/apply-023.yml
          git commit -m "feat: 0.1.23 激光笔、UInk 导入导出、误迹查杀、智能擦、页级懒加载"
          git push
