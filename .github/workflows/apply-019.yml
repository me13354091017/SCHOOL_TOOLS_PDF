name: Apply 0.1.19 patch

# 一次性：下载并应用 0.1.19 代码补丁，提交后连同本工作流一起删除。
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-019.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and apply patch
        run: |
          curl -fL --retry 3 -o /tmp/p019.patch "https://aka.doubaocdn.com/s/B1eEh0hbaI"
          echo "ffd938d5de67eb85f9a13ca2da1bec25b757694126430c3f8a70053271b34675  /tmp/p019.patch" | sha256sum -c
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git apply --whitespace=nowarn /tmp/p019.patch
          git add SCHOOL_PDF
          git rm -q -f tools/0.1.19.patch .github/workflows/apply-019.yml
          git commit -m "feat: 0.1.19 浮动栏点击穿透/粗细 0.5~20/清晰度 1~4"
          git push
