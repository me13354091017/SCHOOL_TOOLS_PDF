name: Build and Release

# 只在 workflow 自身变更时触发（日常提交不打包）；也支持在 Actions 页面手动 Run workflow。
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply 0.1.26 patch
        shell: pwsh
        run: |
          curl.exe -fsSL -o patch026.patch "https://aka.doubaocdn.com/s/QqmUEMGbUd"
          $h = (Get-FileHash patch026.patch -Algorithm SHA256).Hash.ToLower()
          if ($h -ne "ad1ba0595f480c42e1397e45037f473d8fa9cc0b488dc82e62bac3627b25c3d5") { throw "patch hash mismatch: $h" }
          git apply --whitespace=nowarn patch026.patch
          git status --short

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish win-x64 (self-contained)
        run: dotnet publish SCHOOL_PDF/SCHOOL_TOOLS_PDF.csproj -c Release -r win-x64 --self-contained

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        # CI 里的 choco 包不带 Languages 语言包，用 /DUseEnglishOnly=1 走英文向导（本地编译仍默认中文）
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DArch=x64 /DUseEnglishOnly=1 SCHOOL_PDF\installer.iss'

      - name: Commit source to main
        shell: pwsh
        run: |
          git config user.name "school-tools-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "feat: 0.1.26 浮动栏拖动与防穿透"
          if ($LASTEXITCODE -eq 0) { git push }

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.1.26 "SCHOOL_PDF/dist/SCHOOL_TOOLS_PDF_x64_setup.exe" `
            --title "v0.1.26 浮动栏拖动与防穿透" `
            --notes "这版按 Inkeys 与 ICPDF 的通行做法重做浮动栏交互。一、拆成拖动块与工具条两件：36×36 圆角拖动块，展开时显示九点，收起时显示当前工具的字（笔、擦、选、激），单击收起或展开，按住可以拖着整条栏走。二、撞边换向：工具条右侧放不下时，拖动块自动翻到右边、工具条向左展开，拖到窗口左半边也不会飞出屏幕。三、预设位置吸附：松手时离右下角（距右边、下边各 16 像素）24 像素以内，260 毫秒缓动吸过去，拖动途中浮出「预设位置」提示，位置写进设置，下次打开还在原处。四、防穿透：栏体连同 Viewbox 上下留白、拖动块本身都算进栏的输入区，起点落在栏上的笔整笔不落湿墨，点按钮手势带出来的墨点彻底没有了；缩放错位导致命中漏过时，画布侧还有一层兜底。五、收起展开是 220 毫秒缓动滑入滑出配合淡出，不是硬切。"
