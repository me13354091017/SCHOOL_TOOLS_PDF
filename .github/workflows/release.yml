name: Build and Release

# 只在 workflow 自身变更时触发（日常提交不打包）；也支持在 Actions 页面手动 Run workflow。
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish win-x64 (self-contained)
        run: dotnet publish SCHOOL_PDF/SCHOOL_TOOLS_PDF.csproj -c Release -r win-x64 --self-contained

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        # CI 里的 choco 包不带 Languages 语言包，用 /DUseEnglishOnly=1 走英文向导（本地编译仍默认中文）
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DArch=x64 /DUseEnglishOnly=1 SCHOOL_PDF\installer.iss'

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.1.19 "SCHOOL_PDF/dist/SCHOOL_TOOLS_PDF_x64_setup.exe" `
            --title "v0.1.19 命中修复与区间调整" `
            --notes "本次更新：一、修复点击浮动栏穿透：浮动栏整块（按钮间隙与圆角）都纳入命中测试，笔尖或手指落在栏上不再把笔迹带到下面页面；打开文档的加载遮罩期间浮动栏与选择工具条不再拦截点击；墨迹、橡皮、图形三个菜单点外收起时，这一笔不再落到页面误画。二、笔粗细区间改为 0.5~20，步进 0.5，浮动栏三个页签与设置页默认粗细统一，最小 0.5 可写极细标注。三、墨迹保存清晰度倍率区间改为 1~4 倍，默认仍为 4 倍，低倍率可显著减小保存后的 PDF 体积。其余行为与 0.1.18 一致。"
