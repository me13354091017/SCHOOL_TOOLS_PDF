name: Build and Release

# 临时模式：拉取 0.1.24 补丁、应用到 main 并提交。on: *
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply 0.1.24 patch
        run: |
          set -x
          curl -fsSL -o /tmp/p024c.patch "https://aka.doubaocdn.com/s/uUUx4sNYwr"
          echo "6afe60b1ca22f650d55e448e84ca4da8edbf333db9f5cb1e97bb88021cd87cd3  /tmp/p024c.patch" | sha256sum -c
          git apply --whitespace=nowarn /tmp/p024c.patch
          git status --short

      - name: Commit and push
        run: |
          git config user.name "school-tools-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "feat: 0.1.24 UInk 1.1 spec ink exchange"
          git push
