name: Build and Release

# 临时模式：拉取 0.1.24 补丁、应用到 main 并提交，随后把本文件回写为构建模式。
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply 0.1.24 patch
        run: |
          set -x
          curl -fsSL -o /tmp/p024b.patch "https://aka.doubaocdn.com/s/u0FLEtnUoV"
          echo "2d78081add268824e5d9d3568f432995e7e2b9001402e44b6964c02062ed4d67  /tmp/p024b.patch" | sha256sum -c
          git apply --whitespace=nowarn /tmp/p024b.patch
          git status --short

      - name: Commit and push
        run: |
          git config user.name "school-tools-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "feat: 0.1.24 UInk 1.1 spec ink exchange"
          git push
