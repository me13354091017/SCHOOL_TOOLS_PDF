name: Build and Release

# 只在 workflow 自身变更时触发（日常提交不打包）；也支持在 Actions 页面手动 Run workflow。
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish win-x64 (self-contained)
        run: dotnet publish SCHOOL_PDF/SCHOOL_TOOLS_PDF.csproj -c Release -r win-x64 --self-contained

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        # CI 里的 choco 包不带 Languages 语言包，用 /DUseEnglishOnly=1 走英文向导（本地编译仍默认中文）
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DArch=x64 /DUseEnglishOnly=1 SCHOOL_PDF\installer.iss'

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.1.21 "SCHOOL_PDF/dist/SCHOOL_TOOLS_PDF_x64_setup.exe" `
            --title "v0.1.21 浮动栏点按修墨点" `
            --notes "本次更新：修复点击墨迹浮动栏上的按钮时，页面在原地冒出一个墨点的问题。落点在浮动栏范围内的整笔触摸或笔迹不再被页面画布收下，抬笔时整笔丢弃；即使有漏网笔画，只要所有点都落在浮动栏矩形内也会被立刻移除。其余功能与 0.1.20 一致。"
