name: Build and Release

# 只在 workflow 自身变更时触发（日常提交不打包）；也支持在 Actions 页面手动 Run workflow。
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish win-x64 (self-contained)
        run: dotnet publish SCHOOL_PDF/SCHOOL_TOOLS_PDF.csproj -c Release -r win-x64 --self-contained

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        # CI 里的 choco 包不带 Languages 语言包，用 /DUseEnglishOnly=1 走英文向导（本地编译仍默认中文）
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DArch=x64 /DUseEnglishOnly=1 SCHOOL_PDF\installer.iss'

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.1.17 "SCHOOL_PDF/dist/SCHOOL_TOOLS_PDF_x64_setup.exe" `
            --title "v0.1.17 墨迹默认 4 倍" `
            --notes "墨迹保存清晰度上限的默认倍率从 3 改为 4：设置界面「墨迹书写」页的滑条默认即 4 倍，没写过该项的旧设置文件也会自动落到 4 倍。4 倍是 A4 页面在单页约 4096 x 4096 像素上限内能真正达到的档位（约 384 dpi）；再往上一挡会被像素上限自动裁到约 4.3 倍，清晰度不会继续提升。其余行为与 0.1.16 一致。"
