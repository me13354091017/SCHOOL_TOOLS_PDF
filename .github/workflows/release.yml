name: Build and Release

# 只在 workflow 自身变更时触发（日常提交不打包）；也支持在 Actions 页面手动 Run workflow。
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish win-x64 (self-contained)
        run: dotnet publish SCHOOL_PDF/SCHOOL_TOOLS_PDF.csproj -c Release -r win-x64 --self-contained

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        # CI 里的 choco 包不带 Languages 语言包，用 /DUseEnglishOnly=1 走英文向导（本地编译仍默认中文）
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DArch=x64 /DUseEnglishOnly=1 SCHOOL_PDF\installer.iss'

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.1.12 "SCHOOL_PDF/dist/SCHOOL_TOOLS_PDF_x64_setup.exe" `
            --title "v0.1.12 保存时文案修正" `
            --notes "修复保存批注到原 PDF 时界面文案错误：保存复用打开文档的全屏加载页，文案与标题栏都显示“正在打开”。现在保存全程改为“正在保存”，结束后恢复正常标题；保存失败也不会残留错误文案。"