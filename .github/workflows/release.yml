name: Build and Release

# 只在 workflow 自身变更时触发（日常提交不打包）；也支持在 Actions 页面手动 Run workflow。
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish win-x64 (self-contained)
        run: dotnet publish SCHOOL_PDF/SCHOOL_TOOLS_PDF.csproj -c Release -r win-x64 --self-contained

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        # CI 里的 choco 包不带 Languages 语言包，用 /DUseEnglishOnly=1 走英文向导（本地编译仍默认中文）
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DArch=x64 /DUseEnglishOnly=1 SCHOOL_PDF\installer.iss'

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.1.22 "SCHOOL_PDF/dist/SCHOOL_TOOLS_PDF_x64_setup.exe" `
            --title "v0.1.22 调色盘重做与吸管取色" `
            --notes "本次更新：一、调色盘重做，硬笔与软笔共用一套 11 色色板（删掉原来的亮/暗系按钮，把两套里几乎相同的颜色合为一种，并新增紫与灰），选中勾标自动同步。二、新增自定义色：点最后一个色块打开色轮选色，颜色随即生效并把色块显示为该色。三、新增吸管取色：点吸管取色进入取色模式，页面任意位置实时预览屏幕颜色，左键确认写入自定义色，适合取页面底色覆盖原文。四、粗细新增细 1、中 5、粗 12 三档快捷按钮，下方新增墨迹预览曲线，颜色与粗细即时跟随。五、墨迹栏新增拖动把手，按住即可把整条栏拖到任意位置，松手记住位置，设置页的右、下边距滑块同步生效。其余功能与 0.1.21 一致。"
