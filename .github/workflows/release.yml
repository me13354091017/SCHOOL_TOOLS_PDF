name: Build and Release

# 只在 workflow 自身变更时触发（日常提交不打包）；也支持在 Actions 页面手动 Run workflow。
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish win-x64 (self-contained)
        run: dotnet publish SCHOOL_PDF/SCHOOL_TOOLS_PDF.csproj -c Release -r win-x64 --self-contained

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        # CI 里的 choco 包不带 Languages 语言包，用 /DUseEnglishOnly=1 走英文向导（本地编译仍默认中文）
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DArch=x64 /DUseEnglishOnly=1 SCHOOL_PDF\installer.iss'

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.1.16 "SCHOOL_PDF/dist/SCHOOL_TOOLS_PDF_x64_setup.exe" `
            --title "v0.1.16 墨迹清晰度可调" `
            --notes "提升保存后墨迹的清晰度：墨迹层是栅格图，之前固定按 2 倍 DIP 生成，页面重载后一旦被放大或在高分屏上显示，笔画就先糊掉。现在按页面当前实际渲染像素宽（再留 1.25 倍余量）自适应生成，并可在设置界面的「墨迹书写」页用「墨迹保存清晰度上限」滑条调整，范围 2~15 倍。上限越高越清晰，但每页墨迹层的内存与 PDF 体积同步增加：A4 页面单页像素上限约 4096 x 4096，实际最多约 4 倍（约 420dpi），再大也达不到设定倍率。同时保留上一版的颜色修复（预乘 alpha 转直通，解决墨迹发暗）。"
