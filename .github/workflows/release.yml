name: Build and Release

# 只在 workflow 自身变更时触发（日常提交不打包）；也支持在 Actions 页面手动 Run workflow。
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish win-x64 (self-contained)
        run: dotnet publish SCHOOL_PDF/SCHOOL_TOOLS_PDF.csproj -c Release -r win-x64 --self-contained

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        # CI 里的 choco 包不带 Languages 语言包，用 /DUseEnglishOnly=1 走英文向导（本地编译仍默认中文）
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DArch=x64 /DUseEnglishOnly=1 SCHOOL_PDF\installer.iss'

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.1.23 "SCHOOL_PDF/dist/SCHOOL_TOOLS_PDF_x64_setup.exe" `
            --title "v0.1.23 激光笔与 UInk 墨迹交换" `
            --notes "本次更新：一、新增激光笔，点浮动栏的激光按钮进入，按住笔或鼠标就出红色光轨，笔停住会留下光点，一秒后自动淡出；激光只指不写，不落墨、不进撤销、不写进 PDF，讲台上指公式、圈重点不再用手指挡字。二、新增 UInk 墨迹交换格式与导入导出：浮动栏新增更多按钮，菜单里导出 UInk 会把整份文档的批注写成 .uink 文本文件（JSON），换电脑或换账号时导入即可按页还原；同页原有墨迹会被替换，PDF 本身不受影响。三、新增误迹查杀（DDB）：一键扫描当前文档所有页，只清掉极小孤立的墨点（点浮动栏按钮时被提升成笔事件留下的那类），正常笔画一律不动，并提示清掉了几处。四、新增智能擦（仿 Inkeys）：橡皮菜单面积擦页签里有开关，擦到一条笔画的大半时直接整笔清除，原来会留下的细碎残段不再出现。五、块级懒加载：离视口两屏以外的页面挂起墨迹绘制，滚回来立即恢复，长文档翻页和滚动更省资源。六、外观更接近 Fluent：浮动栏与弹层圆角统一放大，主栏和文件菜单都加了柔和投影，新增按钮与原有按钮共用同一套选中态与悬停反馈。其余功能与 0.1.22 一致。"
