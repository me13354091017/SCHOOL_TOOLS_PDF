name: Cleanup 0.1.27

# 临时清理工作流：删掉 v0.1.27 的 Release 与 tag；后续发新版时再改回构建流程。
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v0.1.27 --yes --cleanup-tag || true
          git push origin :refs/tags/v0.1.27 || true
          gh release list || true
